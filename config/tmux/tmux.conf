# ~/.config/tmux/tmux.conf

unbind C-b
set -g prefix C-z
bind C-z send-prefix

set -g mouse off
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1

# Splits with \ and - (side by side / stacked), opening in current dir
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %


bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U

# Resize panes with Alt+Shift+hjkl
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5

bind-key a respawn-pane -k "~/.config/tmux/scripts/app-launcher.sh"

set -g default-shell /run/current-system/sw/bin/fish
set -g status off
